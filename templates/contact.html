{% extends "base.html" %}
{% block title %}Contact Us{% endblock %}

{% block content %}
<div class="page-header" data-aos="fade-down">
    <div class="container">
        <h1 class="display-4 fw-bold mb-2">Contact Us</h1>
        <p class="lead mb-0">We'd love to hear from you.</p>
    </div>
</div>

<div class="container mb-5" data-aos="fade-up">
    <div class="row justify-content-center">
        <div class="col-md-7">
            
            <!-- Contact Details -->
            <div class="card shadow-sm mb-4 border-0 bg-light">
                <div class="card-body p-4 text-center">
                    <h5 class="fw-bold"><i class="bi bi-headset text-primary me-2"></i> Direct Contact</h5>
                    <p class="mb-1"><strong>Email:</strong> anupkhanal556@gmail.com</p>
                    <p class="mb-0"><strong>Phone:</strong> +977 9765572121</p>
                </div>
            </div>

            <!-- Contact Form -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('contact') }}">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea name="message" class="form-control" rows="5" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
