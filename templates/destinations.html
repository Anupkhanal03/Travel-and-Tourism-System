{% extends "base.html" %}

{% block title %}Destinations{% endblock %}

{% block content %}
<div class="container my-5">
    <h2 class="mb-4">All Destinations</h2>
    <div class="row g-4">
        {% for dest in destinations %}
        <div class="col-md-4 col-lg-3">
            <div class="card h-100 shadow-sm">
                <img src="{{ url_for('static', filename='images/' + dest.image) }}?v=3" class="card-img-top" alt="{{ dest.name }}" style="height: 180px; object-fit: cover;" onerror="this.src='https://placehold.co/400x180?text=Nepal'">
                <div class="card-body d-flex flex-column">
                    <span class="badge bg-info text-dark mb-2 align-self-start">{{ dest.category }}</span>
                    <h5 class="card-title">{{ dest.name }}</h5>
                    <p class="text-muted small">{{ dest.location }}</p>
                    <p class="card-text">{{ dest.description }}</p>
                    <a href="{{ url_for('destination_details', dest_id=dest.id) }}" class="btn btn-outline-primary mt-auto">View Details</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
