{% extends 'base.html' %}

{% block title %}Guide Login{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card" data-aos="fade-up">
                    <div class="text-center mb-4">
                        <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                            <i class="bi bi-person-badge fs-2"></i>
                        </div>
                        <h2 class="fw-bold text-primary">Guide Portal</h2>
                        <p class="text-muted">Login to manage your tours and bookings.</p>
                    </div>
                    <form method="POST" action="{{ url_for('guide_login') }}">
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
                            <label for="email">Email address</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            <label for="password">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Login</button>
                    </form>
                    <p class="text-center text-muted mb-0">Not registered? <a href="{{ url_for('guide_register') }}" class="text-primary fw-bold text-decoration-none">Sign up here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
