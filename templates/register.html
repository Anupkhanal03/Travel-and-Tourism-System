{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="auth-card" data-aos="fade-up">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-primary">Join the Adventure</h2>
                        <p class="text-muted">Create an account to book your Nepal trips.</p>
                    </div>
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="form-floating mb-3">
                            <input type="text" name="full_name" id="fullName" class="form-control" placeholder="John Doe" required>
                            <label for="fullName">Full Name</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
                            <label for="email">Email address</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" name="phone" id="phone" class="form-control" placeholder="98XXXXXXXX" required pattern="^(98|97)\d{8}$" title="Phone number must start with 98 or 97 and be exactly 10 digits.">
                            <label for="phone">Phone Number</label>
                        </div>
                        <div class="form-floating mb-4">
                            <input type="password" name="password" id="password" class="form-control" placeholder="Password" required minlength="6">
                            <label for="password">Password</label>
                        </div>
                        <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">Register</button>
                    </form>
                    <p class="text-center text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
